name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The floor and the ceiling of the declared support range, plus the ones in
    # between. A package that patches httpx internals has to prove it on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: audit and conformance
        run: pytest tests/test_suites.py -q

  httpx-range:
    # The one dependency, at both ends of the range we claim to support.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        httpx: ["0.24.1", "0.27.2", "0.28.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" "httpx==${{ matrix.httpx }}"
      # This job checks Orientim itself across the httpx range. The real-SDK
      # tests are skipped here: openai/anthropic have their own, newer httpx
      # floor (anthropic passes socket_options, added after 0.24), so pinning
      # httpx down would test the vendors' compatibility, not ours. They run in
      # full in the `test` job on current httpx.
      - run: pytest tests/test_suites.py -q -k "not real_sdk"

  conformance-report:
    # The number in the README, regenerated on every push. If it moves, the
    # README is wrong and this is where we find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m orientim.cli conformance
      - run: python -m orientim.cli conformance --strict
