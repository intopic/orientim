name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    # Every version the classifiers promise. A package that patches httpx
    # internals has to prove it on each, not on a sample of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: audit and conformance
        run: pytest tests/test_suites.py -q

  coverage:
    # A floor, not a target. Measured at 88%; the gate is 80% so ordinary
    # movement does not trip it and a deleted test module does. Chasing the
    # last percent rewards tests that execute lines, which is not the same as
    # tests that can fail — see docs/claims.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_suites.py -q --cov=orientim --cov-fail-under=80

  lint:
    # Correctness rules only — see [tool.ruff.lint] in pyproject.toml for why
    # the default set is not used. Fast enough to run first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check orientim/ tests/ examples/

  httpx-range:
    # The one dependency, at both ends of the range we claim to support.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        httpx: ["0.24.1", "0.27.2", "0.28.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" "httpx==${{ matrix.httpx }}"
      # This job checks Orientim itself across the httpx range. The real-SDK
      # tests are skipped here: openai/anthropic have their own, newer httpx
      # floor (anthropic passes socket_options, added after 0.24), so pinning
      # httpx down would test the vendors' compatibility, not ours. They run in
      # full in the `test` job on current httpx.
      - run: pytest tests/test_suites.py -q -k "not real_sdk"

  conformance-report:
    # The number in the README, regenerated on every push. If it moves, the
    # README is wrong and this is where we find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m orientim.cli conformance
      - run: python -m orientim.cli conformance --strict

  package:
    # A wheel nobody installed is a wheel that does not work. Build both
    # artefacts, check the metadata PyPI would check, then install the wheel
    # into a clean environment and run it — the path a stranger takes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/orientim --help
          /tmp/fresh/bin/python -c "import orientim; print('version', orientim.__version__)"

  audit:
    # SECURITY.md declares a threat model; this is the part a machine can check.
    # Runtime closure only — what a user actually installs — so a finding here
    # is about them, not about our test tooling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: audit the runtime dependency closure
        run: |
          python -m venv /tmp/rt
          /tmp/rt/bin/pip install --quiet -e .
          /tmp/rt/bin/pip freeze --exclude-editable > /tmp/runtime.txt
          echo "--- runtime closure ---"; cat /tmp/runtime.txt
          pip install --quiet pip-audit
          pip-audit --strict -r /tmp/runtime.txt
