[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orientim"
version = "0.1.0"
description = "Deterministic tests for AI agents — record what your agent actually did, then run it again."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["agents", "llm", "debugging", "replay", "record", "determinism"]
authors = [{ name = "Qazim Memeti" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.24,<1.0"]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = [
  "pytest>=7", "moto[s3]>=5", "boto3>=1.28", "requests>=2.28",
  # the vendors' own SDKs, exercised against a local server that speaks their
  # wire protocol — no key and no network needed. Deliberately unpinned: the
  # majors that moved onto httpx2 are instrumented too now, and the newest of
  # each is exactly what this suite should be run against.
  "openai>=1.40", "anthropic>=0.34",
  "ruff>=0.6", "pytest-cov>=4",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Correctness only, and deliberately so.
#
# The default rule set finds 751 problems here, and around 700 of them are
# UP031: this package supports Python 3.9 and uses percent formatting
# throughout, on purpose. A gate that has to be silenced 700 times is not a
# gate, it is a habit of ignoring output.
#
#   F    pyflakes: undefined names, unused imports, dead locals
#   E9   syntax and IO errors
#   B    bugbear: mutable defaults, lost exception context, dead loop variables
#
# There is no formatter. The source is hand-aligned in places where the
# alignment carries meaning, and a formatter would flatten it for nothing.
#
# There is no type checker. The package ships no annotations, so mypy would
# check that nothing is annotated. If annotations are ever added, this is where
# the gate goes, together with a py.typed marker — and not before, because a
# py.typed on an unannotated package tells other people's type checkers a
# thing that is not true.
select = ["F", "E9", "B"]
ignore = [
  "B008",   # a call in a default argument is a deliberate pattern here
  "B905",   # zip(strict=) does not exist on the 3.9 floor
]

[project.urls]
Homepage = "https://github.com/intopic/orientim"
Documentation = "https://github.com/intopic/orientim/tree/main/docs"
Changelog = "https://github.com/intopic/orientim/blob/main/CHANGELOG.md"
Issues = "https://github.com/intopic/orientim/issues"

[project.scripts]
orientim = "orientim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orientim"]

[tool.hatch.build.targets.sdist]
# `lab/` is deliberately absent: it is the validation fleet, not the product.
# It imports orientim, orientim never imports it, and running it means standing
# up servers for ten minutes — a contributor's job in a checkout, not a user's
# after `pip install`. See lab/README.md, "Packaging: deliberately not
# shipped". `examples/_regression` is absent for a different reason: the
# example deletes and rewrites it on every run.
include = [
  "/orientim", "/tests", "/docs",
  "/examples", "/action.yml",
  "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md",
  "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/pyproject.toml",
]
exclude = ["*.html", "*.jsonl", "**/_runs"]
